# Headless wgpu editor-server. This folder is bind-mounted as /game so the
# server resolves asset paths (assets/bunny.obj, assets/scenes/...) from here.
#
# Build the image once from shinra-engine-core:
#   cd ../shinra-engine-core && docker build -t shinra-editor-server .
#
# Then from this folder:
#   docker compose up
services:
  editor-server:
    image: shinra-editor-server
    user: "1000:1000"  # general first user uid
    ports:
      - "5812:5812"  # HTTP scene API
      - "5813:5813"  # game viewport WS (H.264)
      - "5814:5814"  # editor viewport WS (H.264)
    volumes:
      - .:/game
      # Engine source mounted so the AI / devs can edit it from inside the
      # container. The dev image runs `cargo run` against this source on
      # startup, so engine edits take effect on next `docker compose up`.
      - ../shinra-engine-core:/engine-core
      # Share the host's cargo cache so the container doesn't re-download
      # the crates.io index (which often times out behind firewalls/from
      # certain regions). Host's ~/.cargo is owned by uid 1000, matching
      # the container user, so writes work both ways.
      - ${HOME}/.cargo:/cargo
    working_dir: /game
    environment:
      GAMES_DIR: assets/games
      CARGO_HOME: /cargo
